<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table of Elements</title>

    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #00d7ff;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 65px);
            grid-template-rows: repeat(9, 75px);
            gap: 5px;
            justify-content: center;
            margin: 40px auto;
            width: max-content;
        }

        .element {
            background-color: #282828;
            border: 1px solid #00aaff;
            border-radius: 5px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
            min-width: 0;
        }

        .element:hover {
            background-color: #005f87;
            border: 2px solid #00d7ff;
            transform: scale(1.08);
            z-index: 10;
        }

        /* INFORMATION POPUP */

        .element-info {
            display: none;
            position: absolute;
            top: 0;
            left: 75px;
            width: 230px;
            min-height: 280px;
            background-color: #252526;
            border: 2px solid #00aaff;
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
            color: white;
            box-shadow: 0 5px 20px black;
        }

        .element:hover .element-info {
            display: block;
        }

        /* Popup placement for right-side elements */

        .element.popup-left .element-info {
            left: auto;
            right: 75px;
        }

        .element-info h3 {
            color: #00d7ff;
            margin-top: 0;
            text-align: center;
        }

        .element-picture {
            width: 100%;
            height: 110px;
            border: 1px dashed #888;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            box-sizing: border-box;
        }

        .element-info p {
            font-size: 12px;
            margin: 8px 0;
        }

        .series-label {
            grid-column: 1 / 4;
            color: #00d7ff;
            font-size: 12px;
            display: flex;
            align-items: center;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }

        @media (max-width: 1250px) {
            .periodic-table {
                justify-content: start;
                margin-left: 0;
            }

            body {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

    <h1>PERIODIC TABLE OF ELEMENTS</h1>

    <div class="periodic-table" id="periodicTable">

        <!--Down from here are Elements na-->

    </div>

    <div class="footer">
        Periodic Table | Element Information System
    </div>
